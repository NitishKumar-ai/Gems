name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # The E2E suite runs against real Postgres because production does. Testing against SQLite
    # while deploying to Postgres is how a migration passes CI and fails on deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gems_test?schema=public
      # next-auth refuses to start without this. No GitHub app is configured here, so the value
      # only has to exist — nothing in the suite signs in.
      AUTH_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - run: bun run lint

      - run: bun run typecheck:plugin

      - run: bun run test:plugin

      - run: bun run test:unit

      - run: bun run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # global-setup applies `prisma migrate deploy` into its own schema, so a missing or broken
      # migration fails here rather than after a deploy.
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
